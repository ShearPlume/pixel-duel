name: Deploy web

# Push to main: the deploy server clones/updates the repo, builds the web export
# with its own Godot + templates and publishes it to the game bucket.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Server pulls and releases
        id: release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          OUT=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -lc 'set -e; mkdir -p /home/deploy/build; cd /home/deploy/build; \
              if [ ! -d pixel-duel/.git ]; then git clone https://github.com/ShearPlume/pixel-duel.git; fi; \
              cd pixel-duel; git fetch --prune origin; git clean -fd; git reset --hard origin/main; \
              bash scripts/release_web.sh'" 2>&1)
          printf '%s\n' "$OUT"
          REV=$(printf '%s\n' "$OUT" | sed -n 's/^REVISION=//p' | tail -1)
          if [ -z "$REV" ]; then
            echo "::error::no REVISION from the release script"
            exit 1
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Verify the live page points at the new revision
        env:
          REV: ${{ steps.release.outputs.revision }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://mirugumi.space/minigame/pixel-duel/?t=$RANDOM" | grep -q "$REV"; then
              echo "live at $REV"
              exit 0
            fi
            sleep 6
          done
          echo "::error::live page still does not reference $REV"
          exit 1
