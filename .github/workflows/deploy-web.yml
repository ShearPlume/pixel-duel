name: Deploy web

# On push to main: SSH to the deploy server, update the checkout there, build the
# web export with the server's Godot + templates and publish it to the game
# bucket. First run clones the repo, later runs just fetch/reset.
#
# Repository secrets / variables:
#   DEPLOY_HOST      43.153.223.229  (default, override with a secret)
#   DEPLOY_USER      deploy          (default, override with a secret)
#   DEPLOY_SSH_KEY   private key matching authorized_keys (secret, preferred)
#   DEPLOY_PASSWORD  account password when no key is used (secret, optional)
#   DEPLOY_ROOT      /home/deploy/build                 (variable, optional)
#   PUBLIC_BASE      https://mirugumi-space-1382800327.cos.ap-guangzhou.myqcloud.com/minigame/idolbrawl/ (variable)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: Re-upload the existing build instead of rebuilding
        type: boolean
        default: false

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Non-secret defaults: only a key or password has to be stored.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '43.153.223.229' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/home/deploy/build' }}
      PUBLIC_BASE: ${{ vars.PUBLIC_BASE || 'https://mirugumi-space-1382800327.cos.ap-guangzhou.myqcloud.com/minigame/idolbrawl/' }}
      SKIP_BUILD: ${{ inputs.skip_build && '1' || '0' }}
      GODOT_BIN: ${{ vars.GODOT_BIN }}
      XDG_DATA_HOME_OVERRIDE: ${{ vars.XDG_DATA_HOME }}
    steps:
      - name: Check deploy settings
        run: |
          set -e
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          if [ -z "$DEPLOY_SSH_KEY" ] && [ -z "$DEPLOY_PASSWORD" ]; then
            missing="$missing DEPLOY_SSH_KEY|DEPLOY_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "deploying to $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT"

      - name: Prepare SSH
        run: |
          set -e
          install -m 700 -d ~/.ssh
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "SSH_OPTS=-i ~/.ssh/deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH_OPTS=-o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
            echo "USE_SSHPASS=1" >> "$GITHUB_ENV"
          fi
          echo "StrictHostKeyChecking=accept-new" > ~/.ssh/config
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: SSH probe
        run: |
          set -e
          set +e
          if [ "${USE_SSHPASS:-0}" = "1" ]; then
            sshpass -p "$DEPLOY_PASSWORD" ssh $SSH_OPTS -o ConnectTimeout=15 -o BatchMode=no \
              "$DEPLOY_USER@$DEPLOY_HOST" "echo SSH_OK; whoami" >~/.ssh/probe.out 2>~/.ssh/probe.err
          else
            ssh $SSH_OPTS -o ConnectTimeout=15 -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "echo SSH_OK; whoami" >~/.ssh/probe.out 2>~/.ssh/probe.err
          fi
          code=$?
          cat ~/.ssh/probe.out
          if [ $code -ne 0 ]; then
            echo "::error::SSH login to $DEPLOY_USER@$DEPLOY_HOST failed (exit $code)"
            sed -n '1,20p' ~/.ssh/probe.err
            echo "hint: 'Permission denied (publickey)' means the public key is not in /home/$DEPLOY_USER/.ssh/authorized_keys;"
            echo "      'Host key verification failed' means the host key changed; 'Connection refused/timed out' means the firewall."
            exit 1
          fi

      - name: Preflight (best effort)
        continue-on-error: true
        run: |
          REMOTE='echo "== account =="; whoami; id -nG
            echo "== root =="; ls -la '"$DEPLOY_ROOT"' 2>&1 | head -15
            echo "== godot =="; ls '"$DEPLOY_ROOT"'/tools 2>&1 | head -5
            echo "== templates =="; ls '"$DEPLOY_ROOT"'/xdg/data/godot/export_templates 2>&1
            echo "== coscmd =="; which coscmd; ls -l ~/.cos-minigame.conf 2>&1
            echo "== sudo =="; sudo -n true 2>&1 && echo SUDO_PASSWORDLESS || echo SUDO_NEEDS_PASSWORD
            echo "== site =="; ls -la /home/admin/mirugumi.space 2>&1 | head -20
            echo "== nginx =="; (nginx -T 2>/dev/null || sudo -n nginx -T 2>/dev/null) | grep -nE "configuration file|location |proxy_pass|root |alias " | head -60'
          if [ "${USE_SSHPASS:-0}" = "1" ]; then
            sshpass -p "$DEPLOY_PASSWORD" ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE" || true
          else
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE" || true
          fi
      - name: Server pulls and releases
        id: release
        run: |
          set -e
          REMOTE="set -e
            mkdir -p $DEPLOY_ROOT
            cd $DEPLOY_ROOT
            if [ ! -d pixel-duel/.git ]; then
              git clone https://github.com/ShearPlume/pixel-duel.git pixel-duel
            fi
            cd pixel-duel
            git fetch --prune origin
            git reset --hard origin/main
            git clean -fd
            PUBLIC_BASE='$PUBLIC_BASE' SKIP_BUILD=$SKIP_BUILD GODOT_BIN='$GODOT_BIN' XDG_DATA_HOME='$XDG_DATA_HOME_OVERRIDE' bash scripts/release_web.sh"
          if [ -n "$USE_SSHPASS" ]; then
            OUT=$(sshpass -p "$DEPLOY_PASSWORD" ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE" 2>&1)
          else
            OUT=$(ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE" 2>&1)
          fi
          printf '%s\n' "$OUT"
          REV=$(printf '%s\n' "$OUT" | sed -n 's/^REVISION=//p' | tail -1)
          if [ -z "$REV" ]; then
            echo "::error::release script did not report a revision"
            exit 1
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Smoke test the live build
        env:
          REV: ${{ steps.release.outputs.revision }}
        run: |
          set -e
          base="${PUBLIC_BASE}${REV}/"
          echo "asset base: $base"
          encoding=$(curl -sI -H "Accept-Encoding: gzip" "${base}index.wasm" | tr -d '\r' \
            | awk 'tolower($1)=="content-encoding:"{print tolower($2)}')
          echo "wasm content-encoding: ${encoding:-none}"
          curl -fsS --compressed -o /tmp/index.wasm "${base}index.wasm"
          curl -fsS --compressed -o /tmp/index.pck "${base}index.pck"
          python3 - <<'PY'
          import pathlib
          wasm = pathlib.Path('/tmp/index.wasm').read_bytes()
          pck = pathlib.Path('/tmp/index.pck').read_bytes()
          assert wasm[:4] == b'\x00asm', f'bad wasm magic {wasm[:4]!r}'
          assert pck[:4] == b'GDPC', f'bad pck magic {pck[:4]!r}'
          print(f'wasm {len(wasm) / 2**20:.2f} MiB, pck {len(pck) / 2**20:.2f} MiB, both load')
          PY
      - name: Verify the live page points at the new revision
        env:
          REV: ${{ steps.release.outputs.revision }}
        run: |
          set -e
          for i in $(seq 1 12); do
            # COS only resolves the index document for the bucket root prefix, so a
            # sub-folder entry page has to be addressed by its file name.
            if curl -fsS "${PUBLIC_BASE}index.html?t=$RANDOM" | grep -q "$REV"; then
              echo "live at $REV -> ${PUBLIC_BASE}index.html"
              exit 0
            fi
            sleep 5
          done
          echo "::error::live page does not reference $REV yet (${PUBLIC_BASE}index.html)"
          exit 1








