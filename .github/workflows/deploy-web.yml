name: Deploy web

# On push to main: SSH to the deploy server, update the checkout there, build the
# web export with the server's Godot + templates and publish it to the game
# bucket. First run clones the repo, later runs just fetch/reset.
#
# Repository secrets / variables:
#   DEPLOY_HOST      43.153.223.229                     (secret)
#   DEPLOY_USER      deploy                             (secret)
#   DEPLOY_SSH_KEY   private key matching authorized_keys (secret, preferred)
#   DEPLOY_PASSWORD  account password when no key is used (secret, optional)
#   DEPLOY_ROOT      /home/deploy/build                 (variable, optional)
#   PUBLIC_BASE      https://mirugumi.space/minigame/pixel-duel/ (variable)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: Re-upload the existing build instead of rebuilding
        type: boolean
        default: false

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/home/deploy/build' }}
      PUBLIC_BASE: ${{ vars.PUBLIC_BASE || 'https://mirugumi.space/idolbrawl/' }}
      SKIP_BUILD: ${{ inputs.skip_build && '1' || '0' }}
      GODOT_BIN: ${{ vars.GODOT_BIN }}
      XDG_DATA_HOME_OVERRIDE: ${{ vars.XDG_DATA_HOME }}
    steps:
      - name: Check deploy settings
        run: |
          set -e
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          if [ -z "$DEPLOY_SSH_KEY" ] && [ -z "$DEPLOY_PASSWORD" ]; then
            missing="$missing DEPLOY_SSH_KEY|DEPLOY_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "deploying to $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT"

      - name: Prepare SSH
        run: |
          set -e
          install -m 700 -d ~/.ssh
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "SSH_OPTS=-i ~/.ssh/deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH_OPTS=-o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
            echo "USE_SSHPASS=1" >> "$GITHUB_ENV"
          fi
          echo "StrictHostKeyChecking=accept-new" > ~/.ssh/config
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Server pulls and releases
        id: release
        run: |
          set -e
          REMOTE="set -e
            mkdir -p $DEPLOY_ROOT
            cd $DEPLOY_ROOT
            if [ ! -d pixel-duel/.git ]; then
              git clone https://github.com/ShearPlume/pixel-duel.git pixel-duel
            fi
            cd pixel-duel
            git fetch --prune origin
            git reset --hard origin/main
            git clean -fd
            PUBLIC_BASE='$PUBLIC_BASE' SKIP_BUILD=$SKIP_BUILD GODOT_BIN='$GODOT_BIN' XDG_DATA_HOME='$XDG_DATA_HOME_OVERRIDE' bash scripts/release_web.sh"
          if [ -n "$USE_SSHPASS" ]; then
            OUT=$(sshpass -p "$DEPLOY_PASSWORD" ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE" 2>&1)
          else
            OUT=$(ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE" 2>&1)
          fi
          printf '%s\n' "$OUT"
          REV=$(printf '%s\n' "$OUT" | sed -n 's/^REVISION=//p' | tail -1)
          if [ -z "$REV" ]; then
            echo "::error::release script did not report a revision"
            exit 1
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Verify the live page points at the new revision
        env:
          REV: ${{ steps.release.outputs.revision }}
        run: |
          set -e
          for i in $(seq 1 12); do
            if curl -fsS "${PUBLIC_BASE}?t=$RANDOM" | grep -q "$REV"; then
              echo "live at $REV -> $PUBLIC_BASE"
              exit 0
            fi
            sleep 5
          done
          echo "::error::live page does not reference $REV yet ($PUBLIC_BASE)"
          exit 1


